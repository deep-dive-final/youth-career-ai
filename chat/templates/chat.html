{% load static %}

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 상담 - 정책 추천 서비스</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chat.css' %}" />
    <style>
      .typing-indicator {
        display: inline-flex;
        align-items: center;
        padding: 12px 16px;
        background: #ffffff;
        border-radius: 15px;
        border-top-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        margin-bottom: 10px;
      }
      .typing-indicator span {
        height: 6px;
        width: 6px;
        background: #8fd3ce; /* 전송 버튼과 같은 민트색 */
        border-radius: 50%;
        margin: 0 3px;
        display: block;
        animation: bounce 1.3s infinite ease-in-out;
      }
      .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
      .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1.2); opacity: 1; }
      }
      /* Phase 3-A: 정책 버튼 그룹 */
      .policy-btn-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 8px 0 8px 48px;
      }
      .policy-btn {
        background: #f0fafa;
        border: 1px solid #8fd3ce;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        color: #2d7a75;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s;
      }
      .policy-btn:hover { background: #d4f0ee; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-top">
          <button class="btn-icon" onclick="goBack()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <div style="flex: 1; text-align: center">
            <h2 style="margin: 0">AI 상담</h2>
            <p style="margin: 0; font-size: 12px; color: #a0aec0">
              24시간 언제나 상담 가능
            </p>
          </div>
          <div style="width: 44px; text-align: right;">
            <button class="btn-icon" onclick="resetChat()" title="대화 초기화">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="chat-container">
        <div id="chatMessages" class="chat-messages"></div>

        <div class="quick-questions" id="quickQuestions">
          <button
            class="quick-question-btn"
            onclick="sendMessage('청년 월세 지원사업에 대해 알려줘')"
          >
            청년 월세 지원사업
          </button>
          <button
            class="quick-question-btn"
            onclick="sendMessage('나이 25세에 받을 수 있는 정책은?')"
          >
            나이별 정책
          </button>
          <button
            class="quick-question-btn"
            onclick="sendMessage('취업 관련 정책 추천해줘')"
          >
            취업 정책
          </button>
          <button
            class="quick-question-btn"
            onclick="sendMessage('신청 방법이 궁금해')"
          >
            신청 방법
          </button>
        </div>

        <div class="chat-input-wrapper">
          <form class="chat-input-form" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="chatInput"
              class="chat-input"
              placeholder="궁금한 점을 물어보세요..."
              autocomplete="off"
            />
            <button type="submit" id="sendBtn" class="chat-send-btn">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Floating Home Button -->
    <button
      id="floatingHome"
      class="floating-home"
      onclick="window.location.href = 'index.html'"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>

   <script src="{% static 'js/data.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script>
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const quickQuestions = document.getElementById("quickQuestions");

      // 로딩 요소를 관리할 전역 변수
      let loadingElement = null;
      let loadingTimers  = [];   // 단계별 메시지 타이머 목록

      // 화면 처음 열었을 때 메세지 노출 처리
      document.addEventListener("DOMContentLoaded", () => {
        loadChatHistory();
        chatInput.focus();
      });

      // 로딩 애니메이션 생성 함수 (단계별 메시지 포함)
      function showLoading() {
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "chat-message ai";
        loadingDiv.innerHTML = `
          <div class="chat-avatar ai">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
            </svg>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
            <div id="loadingStatusMsg" style="font-size:12px; color:#8fd3ce; padding-left:4px; min-height:18px; transition: opacity 0.4s;"></div>
          </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // 단계별 상태 메시지 (5초 / 15초 / 25초)
        const statusMessages = [
          { delay: 5000,  text: "🔍 정책 DB를 검색하고 있어요..." },
          { delay: 15000, text: "📋 맞춤 정책을 선별 중이에요..." },
          { delay: 25000, text: "⏳ 거의 다 됐어요! 조금만 기다려 주세요." },
        ];
        loadingTimers = [];
        statusMessages.forEach(({ delay, text }) => {
          const t = setTimeout(() => {
            const el = document.getElementById("loadingStatusMsg");
            if (el) { el.style.opacity = "0"; setTimeout(() => { if (el) { el.textContent = text; el.style.opacity = "1"; } }, 200); }
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }, delay);
          loadingTimers.push(t);
        });

        return loadingDiv;
      }

      // 로딩 제거 시 타이머도 함께 정리
      function hideLoading() {
        loadingTimers.forEach(t => clearTimeout(t));
        loadingTimers = [];
        if (loadingElement) { loadingElement.remove(); loadingElement = null; }
      }

      // 과거 대화 내역 불러오기
      function loadChatHistory() {
        fetch(`/chat/api/chat_init`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((result) => {
            console.log("loadChatHistory", result);
            loadChatHistory_callback(result.data);
          })
          .catch((error) => {
            console.error("loadChatHistory catch :", error);
          });
      }

      // 과거 대화 내역 불러오기 콜백
      function loadChatHistory_callback(data) {
        if (!data || data.length === 0) {
          const welcomeMessage =
            "안녕하세요! 👋\n정책 추천 AI 상담사입니다.\n\n궁금하신 정책이나 신청 방법에 대해 물어보세요!";
          addAIMessage(welcomeMessage);
        }
      }

      // 화면에 메세지 노출
      function addMessage(text, isUser) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `chat-message ${isUser ? "user" : "ai"}`;

        messageDiv.innerHTML = `
        <div class="chat-avatar ${isUser ? "user" : "ai"}">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            ${
              isUser
                ? '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>'
                : '<path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>'
            }
          </svg>
        </div>
        <div class="chat-bubble ${isUser ? "user" : "ai"}">${text.replace(/\n/g, "<br>")}</div>
      `;

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function addAIMessage(text) {
        addMessage(text, false);
      }

      function addUserMessage(text) {
        addMessage(text, true);
      }

      // 사용자가 메세지 전송 (중복 제거 버전)
      function handleSubmit(event) {
        event.preventDefault();

        const text = chatInput.value.trim();
        if (!text) return;

        quickQuestions.style.display = "none";
        chatInput.value = "";
        addUserMessage(text);

        sendBtn.disabled = true;
        chatInput.disabled = true;

        // --- 1. 로딩 애니메이션 시작 ---
        loadingElement = showLoading();

        fetch(`/chat/api/chat_response`, {
          method: "POST",
          body: JSON.stringify({ message: text }),
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((result) => {
            // --- 2. 응답 시 로딩 애니메이션 + 타이머 모두 제거 ---
            hideLoading();
            if (result.status === "success" && result.data) {
              chat_response_callback(result.data);
            } else {
              const msg = result.message || "응답 처리 중 오류가 발생했습니다.";
              addAIMessage(msg);
              sendBtn.disabled = false;
              chatInput.disabled = false;
            }
          })
          .catch((error) => {
            hideLoading();
            console.error("chat_response catch :", error);
            addAIMessage("연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.");
            sendBtn.disabled = false;
            chatInput.disabled = false;
          });
      }

      // AI 응답 요청 콜백 — Phase 3-A: policy_list 있으면 버튼 렌더링
      function chat_response_callback(data) {
        addAIMessage(data.answer);

        if (data.policy_list && data.policy_list.length > 0) {
          const btnGroup = document.createElement("div");
          btnGroup.className = "policy-btn-group";
          data.policy_list.forEach((item, idx) => {
            const btn = document.createElement("button");
            btn.className = "policy-btn";
            btn.textContent = `[${idx + 1}] ${item.name} (${item.region})`;
            btn.onclick = () => requestDetail(item.id);
            btnGroup.appendChild(btn);
          });
          chatMessages.appendChild(btnGroup);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.disabled = false;
        chatInput.disabled = false;
        chatInput.focus();
      }

      // 대화 초기화 함수
      async function resetChat() {
        if (!confirm("대화 내역을 초기화하시겠습니까?")) return;

        try {
          const response = await fetch(`/chat/api/chat_reset`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify({})
          });

          const result = await response.json();

          if (result.status === "success") {
            chatMessages.innerHTML = "";
            const welcomeMessage = "대화가 초기화되었습니다. 👋\n새로운 질문을 입력해 주세요!";
            addAIMessage(welcomeMessage);
            quickQuestions.style.display = "flex";
          } else {
            alert("초기화 실패: " + result.message);
          }
        } catch (error) {
          console.error("resetChat Error:", error);
          alert("서버 통신 중 오류가 발생했습니다.");
        }
      }

      // Django CSRF 토큰 가져오기
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }

      // Phase 3-B: 정책 상세보기 요청
      function requestDetail(policyId) {
        if (loadingElement) loadingElement.remove();
        loadingElement = showLoading();
        sendBtn.disabled = true;
        chatInput.disabled = true;

        fetch(`/chat/api/chat_response`, {
          method: "POST",
          body: JSON.stringify({ step: "detail", policy_id: policyId }),
          headers: { "Content-Type": "application/json" },
        })
          .then((r) => r.json())
          .then((result) => {
            if (loadingElement) { loadingElement.remove(); loadingElement = null; }
            if (result.status === "success") {
              addAIMessage(result.data.answer);
            } else {
              addAIMessage("정책 정보를 불러오는 데 실패했습니다.");
            }
            sendBtn.disabled = false;
            chatInput.disabled = false;
            chatInput.focus();
          })
          .catch((error) => {
            if (loadingElement) { loadingElement.remove(); loadingElement = null; }
            console.error("requestDetail error:", error);
            addAIMessage("연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.");
            sendBtn.disabled = false;
            chatInput.disabled = false;
          });
      }
    </script>
  </body>
</html>
